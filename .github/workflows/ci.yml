name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch. Superseded pull request runs are dropped; pushes to main
# are not, so two deploys can never race for the same Worker.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # ngp's native engine needs macOS or glibc Linux on x64/arm64, which this is.
    # On anything else it would need `engine: 'wasm'` in the ngp() options.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ngp requires Node 26.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      # `.npmrc` sets legacy-peer-deps, because Angular is pinned to the
      # prerelease ngp was built against and npm never matches a prerelease
      # against a plain peer range. `allowScripts` in package.json covers the
      # native postinstalls npm 11 blocks by default (esbuild, workerd,
      # @parcel/watcher, fsevents) — without them workerd has no binary.
      - run: npm ci

      # Formatting (Oxfmt) and lint (Oxlint, type-aware) for the whole workspace.
      - run: npx vp check

      # Builds every app through Vite+'s task runner. Each build also runs
      # ngp's template and TypeScript type check and the bundle budgets, so a
      # type error or an oversized bundle fails CI.
      - run: npx vp run -r build

      # `vp build` writes each app's dist/ssr/wrangler.json and points wrangler
      # at it through the app's .wrangler/deploy/config.json, so this deploys
      # the built Worker rather than the app's wrangler.jsonc, whose `main` is
      # TypeScript source.
      - name: Deploy movies to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/movies
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy demo to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/demo
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
